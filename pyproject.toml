[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabius-media-engine"
version = "0.1.0"
description = "Open-source, AI-contribution-friendly media link analysis and local downloading toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "FABIUS Media Engine contributors"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "yt-dlp>=2025.1.1",
  "gallery-dl>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[project.scripts]
fabius-media = "fabius_media_engine.cli:main"

[tool.setuptools.package-data]
fabius_media_engine = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
